<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Berhasil - Balorant Bot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f1923 0%, #1a2332 100%);
      color: #ece8e1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(102, 252, 241, 0.3);
      border-radius: 16px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { color: #66fcf1; font-size: 28px; margin-bottom: 12px; }
    p { color: #ece8e1; opacity: 0.8; font-size: 16px; line-height: 1.5; margin-bottom: 24px; }
    .hint {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 16px;
      font-size: 14px;
      color: #ffc857;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>Login Berhasil!</h1>
    <p>Akun Riot Games kamu sudah terhubung ke bot Balorant.</p>
    <div class="hint">
      💡 Kamu sekarang bisa kembali ke Discord dan mencoba command <strong>/shop</strong> atau <strong>/profile</strong>!
    </div>
  </div>
</body>
</html>
