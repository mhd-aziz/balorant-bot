<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Bot - Link Account</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f1923 0%, #1a2634 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #ff4655;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #a0a0a0;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .step {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid #ff4655;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .step-number {
            color: #ff4655;
            font-weight: bold;
            margin-right: 8px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: monospace;
            margin-bottom: 15px;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        input::placeholder, textarea::placeholder {
            color: #666;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #ff4655;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover:not(:disabled) {
            background: #e03e4c;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
        }
        .status.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff4655;
            color: #ff4655;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ff4655;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Link Akun Valorant</h1>
        <p class="subtitle">Paste URL dari Riot login untuk link akun kamu ke bot</p>

        <div class="step">
            <span class="step-number">1.</span> Klik link login dari bot Discord, login dengan akun Riot
        </div>
        <div class="step">
            <span class="step-number">2.</span> Setelah redirect, copy <strong>seluruh URL</strong> dari address bar browser
        </div>
        <div class="step">
            <span class="step-number">3.</span> Paste URL di bawah dan klik Submit
        </div>

        <form id="tokenForm">
            <label for="discordId">Discord User ID (dari pesan bot):</label>
            <input type="text" id="discordId" placeholder="696769283086090342" required>

            <label for="urlInput">URL dari Riot (paste di sini):</label>
            <textarea id="urlInput" placeholder="https://playvalorant.com/opt_in#access_token=...&id_token=..." required></textarea>

            <button type="submit" id="submitBtn">🔗 Link Akun</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #ccc;">Memproses...</p>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        // Auto-fill Discord ID dari URL query param jika ada
        const urlParams = new URLSearchParams(window.location.search);
        const discordIdParam = urlParams.get('discord_id');
        if (discordIdParam) {
            document.getElementById('discordId').value = discordIdParam;
        }

        document.getElementById('tokenForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const urlInput = document.getElementById('urlInput').value.trim();
            const discordId = document.getElementById('discordId').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');

            // Hide previous status
            status.style.display = 'none';
            status.className = 'status';

            // Validate
            if (!urlInput || !discordId) {
                showStatus('error', '❌ Discord ID dan URL harus diisi!');
                return;
            }

            // Parse URL fragment
            let fragment;
            try {
                if (urlInput.includes('#')) {
                    fragment = urlInput.split('#')[1];
                } else {
                    fragment = urlInput;
                }

                const params = new URLSearchParams(fragment);
                const accessToken = params.get('access_token');
                const idToken = params.get('id_token');

                if (!accessToken) {
                    showStatus('error', '❌ access_token tidak ditemukan di URL. Pastikan URL lengkap dari address bar.');
                    return;
                }

                // Show loading
                submitBtn.disabled = true;
                loading.style.display = 'block';

                // Send to API
                const response = await fetch('/api/link-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        discord_id: discordId,
                        access_token: accessToken,
                        id_token: idToken
                    })
                });

                const data = await response.json();

                loading.style.display = 'none';
                submitBtn.disabled = false;

                if (response.ok) {
                    showStatus('success', `✅ Berhasil! Akun ${data.game_name}#${data.tag_line} ter-link ke Discord.<br><br>Kamu bisa kembali ke Discord dan gunakan /profile, /recent, dll.`);
                    document.getElementById('tokenForm').reset();
                } else {
                    showStatus('error', `❌ Error: ${data.error || 'Unknown error'}`);
                }

            } catch (error) {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                showStatus('error', `❌ Error: ${error.message}`);
            }
        });

        function showStatus(type, message) {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.innerHTML = message;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
